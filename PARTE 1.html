<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Shower Sorpresa</title>
    <link rel="stylesheet" href="C:\Users\user\OneDrive\Documentos\INVITACION BABY SHOWER\DISEÑO2.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
</head>
<body>

    <audio id="musica" src="musica.mp3" loop></audio>

    <div id="pantalla-sobre">
        <div class="indicador">
            <span class="flecha">👇</span>
            <div class="sobre-click" onclick="abrirInvitacion()">
                <img src="C:\Users\user\OneDrive\Documentos\INVITACION BABY SHOWER\IMAGENES\fa372089-7587-4871-a540-c732aeec5153.jpg" alt="Sobre Invitación" class="img-sobre">
            </div>
            <p class="texto-abrir">TOCA PARA ABRIR LA SORPRESA</p>
        </div>
    </div>
    </div>

    <main id="invitacion-principal">
        <header class="hero">
            <p class="subtitulo">¡BABY SHOWER SORPRESA!</p>
            <h1 class="nombre-bebe">¡Es una Niña!</h1>
        </header>

        <section class="seccion-padres">
            <img src="C:\Users\user\OneDrive\Documentos\INVITACION BABY SHOWER\IMAGENES\d0633477-b0df-4561-b23e-35281e2812ab.jpg" alt="Padres" class="foto-perfil">
            <p class="tios-texto">Organizado con amor por sus tíos</p>
        </section>

        <section class="info-evento">
            <div class="fecha-caja">
                <p>MARTES</p>
                <span class="numero-dia">03</span>
                <p>MARZO| 7:00 PM</p>
            </div>
            
            <p class="direccion">
                <strong>UBICACIÓN:</strong><br>
                Calle 18 de Marzo 168, Colima, Col.
            </p>

            <div class="botones-interactivos">
                <a href="https://maps.app.goo.gl/DnTJFdnj9zbqS1sd6" class="btn btn-dorado">UBICACION</a>
                
                <a href="https://wa.me/TU_NUMERO_MAMA?text=Confirmo%20asistencia" class="btn btn-rosa">📱 CONFIRMAR A MAMÁ</a>
                
                <a href="https://wa.me/TU_NUMERO_PAPA?text=Confirmo%20asistencia" class="btn btn-rosa">📱 CONFIRMAR A PAPÁ</a>
            </div>
        </section>

        <footer class="final">
            <p>¡No faltes, será inolvidable!</p>
        </footer>
    </main>

    <script>
        function abrirInvitacion() {
            // Reproduce la música
            const audio = document.getElementById('musica');
            audio.play().catch(e => console.log("Música activada"));

            // Anima el sobre hacia arriba
            document.getElementById('pantalla-sobre').classList.add('subir-sobre');

            // Muestra la invitación y permite el scroll
            setTimeout(() => {
                document.getElementById('invitacion-principal').classList.add('mostrar-invitacion');
                document.body.style.overflowY = "auto";
            }, 300);
        }
    </script>
</body>
</html>
